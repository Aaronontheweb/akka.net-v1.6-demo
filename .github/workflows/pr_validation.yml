name: pr_validation

on:
  push:
    branches:
      - master
      - dev
      - main
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  test:
    name: Test-${{matrix.os}}
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "Update release notes"
        shell: pwsh
        run: |
          ./build.ps1

      - name: "dotnet build"
        run: dotnet build -c Release

      - name: "dotnet test"
        shell: bash
        run: dotnet test -c Release --no-build

      - name: "dotnet pack"
        run: dotnet pack -c Release -o ./bin/nuget

      - name: "Publish native server and client"
        shell: pwsh
        run: ./scripts/publish-native.ps1 -RuntimeIdentifier ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}

      - name: "Run native TUI clients over Artery"
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-chat.py

      - name: "Upload native applications"
        uses: actions/upload-artifact@v4
        with:
          name: chat-${{ runner.os }}
          path: |
            artifacts/server/Demo.Server*
            artifacts/client/Demo.Client*
